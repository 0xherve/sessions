name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "enter a version number"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "version must look like 0.1! We got '$VERSION'"; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "release v$VERSION already exists"; exit 1; fi
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run --cwd apps/extension build
      - run: |
          cd apps/sessions
          for target in linux-x64 darwin-arm64; do
            bun build src/cli/main.ts --compile --target=bun-$target --outfile dist/sessions-$target
          done
      - run: cd apps/extension && zip -r sessions-extension.zip dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            apps/extension/sessions-extension.zip
            apps/sessions/dist/sessions-linux-x64
            apps/sessions/dist/sessions-darwin-arm64
