<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sessions</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Sessions</h1>
      <span id="status" class="status" data-state="unpaired">Not paired</span>
    </header>

    <p id="error" class="banner" role="alert" hidden></p>

    <main>
      <section id="view-unpaired">
        <p class="hint">Run <code>sessions pair</code> in your terminal, then paste the code here.</p>
        <label for="code">Pairing code</label>
        <input id="code" type="text" autocomplete="off" spellcheck="false" />
        <button id="pair" type="button">Pair</button>
      </section>

      <section id="view-ready" hidden>
        <p class="hint">Agents can only see what you share.</p>
        <button id="share-tab" type="button">Share this tab</button>
        <button id="share-group" type="button" class="secondary">Share this tab group</button>

        <h2>Shared sessions</h2>
        <ul id="shared" class="shared"></ul>

        <h2>Sites agents may use</h2>
        <ul id="origins" class="shared"></ul>
        <div class="inline">
          <input id="origin" type="text" autocomplete="off" spellcheck="false" placeholder="example.com" />
          <button id="allow" type="button" class="secondary">Allow</button>
        </div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
